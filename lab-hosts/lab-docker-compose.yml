services:
  metasploitable2:
    image: tleemcjr/metasploitable2:latest
    container_name: sentry-target-metasploitable2
    hostname: victim
    command: sh -c "/bin/services.sh && tail -f /dev/null"
    networks:
      - sentry-lab
    ports:
      - "1234:21"   # vsftpd 2.3.4 (backdoor CVE-2011-2523)
      - "1235:22"   # OpenSSH antigo
      - "1236:80"   # Apache antigo / DVWA
      - "1237:3306" # MySQL antigo
      - "1238:445"   # Samba

networks:
  sentry-lab:
    external: true
    name: sentry-lab
