spring:
  application:
    name: sentry

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

    template:
      mandatory: true
      retry:
        enabled: true
        max-retries: 3
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 5s
    
  datasource:
    url: jdbc:mysql://localhost:3306/sentry_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

nmap:
  # tempo maximo (em segundos) que um scan do Nmap pode rodar antes de
  # ser encerrado automaticamente. Evita que um scan travado (rede lenta,
  # alvo que nao responde, etc.) prenda a aplicacao indefinidamente.
  timeout-seconds: ${NMAP_TIMEOUT_SECONDS:120}

nvd:
  # chave gratuita: https://nvd.nist.gov/developers/request-an-api-key
  # sem chave funciona, mas o rate limit do NVD cai de 50 para 5 req/30s
  api-key: ${NVD_API_KEY:}

sentry:
  security:
    jwt:
      # chave de assinatura HS256 (minimo 32 caracteres). Gere com: openssl rand -base64 48
      # NAO versione o valor: defina a variavel de ambiente SENTRY_JWT_SECRET.
      secret: ${SENTRY_JWT_SECRET:prescribe-awaken-exorcism-smirk-unwrapped-voicing-those-postage}
      expiration: ${SENTRY_JWT_EXPIRATION:PT2H}
      issuer: sentry
    cors:
      # origens permitidas a chamar a API pelo navegador (separadas por virgula)
      allowed-origins: ${SENTRY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    # Swagger/OpenAPI sem login. Em producao use SENTRY_PUBLIC_DOCS=false.
    public-docs: ${SENTRY_PUBLIC_DOCS:true}
    # administrador criado na primeira inicializacao, se ainda nao existir nenhum usuario
    bootstrap-admin:
      name: ${SENTRY_ADMIN_NAME:Administrador}
      email: ${SENTRY_ADMIN_EMAIL:admin@sentry.com}
      password: ${SENTRY_ADMIN_PASSWORD:12345678}

management:
  endpoint:
    health:
      # anonimo ve so o status; detalhes (banco, rabbit) apenas para ADM
      show-details: when-authorized
      roles: ADM
