spring:
  application:
    name: sentry

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

    template:
      mandatory: true
      retry:
        enabled: true
        max-retries: 3
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 5s
    
  datasource:
    url: jdbc:mysql://localhost:3306/sentry_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

nmap:
  # tempo maximo (em segundos) que um scan do Nmap pode rodar antes de
  # ser encerrado automaticamente. Evita que um scan travado (rede lenta,
  # alvo que nao responde, etc.) prenda a aplicacao indefinidamente.
  timeout-seconds: ${NMAP_TIMEOUT_SECONDS:120}

nvd:
  # chave gratuita: https://nvd.nist.gov/developers/request-an-api-key
  # sem chave funciona, mas o rate limit do NVD cai de 50 para 5 req/30s
  api-key: ${NVD_API_KEY:}

management:
  endpoint:
    health:
      show-details: always
